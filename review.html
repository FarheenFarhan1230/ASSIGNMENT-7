<!DOCTYPE html>
<html>
<head>
    <title>Your Review</title>
</head>

<body>
<table width="100%" cellspacing="0" cellpadding="10" border="1" style="border-color:
     lightgrey; text-align: center;">
     <tr>
        <td bgcolor="lightgreen" width="33%">Step 1: Account</td>
        <td bgcolor="lightgreen" width="33%"><b>Step 2: Personal Details</b></td>
        <td bgcolor="lightblue" width="33%">Step 3: Your Review</td>
 </tr>
      </table>
      <br>
      <form>
        <fieldset>
            <legend>Your Review</legend>
            <p>
                <p>
            How did you hear about us?
            <select>
                <option value="">Select your option</option>
                <option value="Google">Google</option>
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
     </select>
    </p>
    <p>
         Would you visit again?<br>
        <input type="radio" id="yes" name="visit_again">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="visit_again">
        <label for="no">No</label>
        <input type="radio" id="maybe" name="visit_again">
        <label for="maybe">Maybe</label>
     </p>
     <p>
        Comments:
        <br>
        <textarea name="comments" rows="4" cols="40" placeholder="Enter your comments..."></textarea>
     </p>
     <p>
        Documents:<br>
        <input type="file" name="documents">
    </p>
    <p>
        <input type="checkbox" id="updates" name="email_updates" checked>
        <label for="updates">Sign me up for email updates</label>
  </p>
  <p>
    <a href="personal.html">
   <img src="./back button.png" alt="Back" width="110">
</a>
    <a href="thankyou.html">
    <img src="./submit button.png" alt="Submit" width="110">
</a>
  </p>
  <br>
</body>
</html>
